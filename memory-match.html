<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Match · NeuroSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sand: '#f3e9d9',
            clay: '#a66e4e',
            leaf: '#6b9b7a',
            water: '#6fa8dc',
            blush: '#f8efe7'
          },
          fontFamily: {
            display: ['Fraunces', 'serif'],
            sans: ['DM Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #f9f6f0 0%, #f1e4d9 100%);
      min-height: 100vh;
      color: #2b241d;
    }
    .font-display { font-family: 'Fraunces', serif; }

    .memory-shell {
      max-width: 900px;
      margin: 40px auto;
      padding: 24px;
    }

    .game-card {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(118, 92, 76, 0.14);
      box-shadow: 0 20px 40px rgba(94, 71, 58, 0.08);
      border-radius: 30px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      aspect-ratio: 1 / 1;
      border: none;
      background: transparent;
      cursor: pointer;
      perspective: 1000px;
      position: relative;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s ease;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      user-select: none;
    }

    .card-front {
      background: linear-gradient(135deg, #b98566 0%, #8d6049 100%);
      color: white;
      box-shadow: inset 0 2px 8px rgba(255,255,255,0.25);
    }

    .card-front .symbol {
      font-size: clamp(2rem, 3vw, 3rem);
      font-weight: 700;
      opacity: 0.92;
    }

    .card-back {
      background: linear-gradient(135deg, #fffaf5 0%, #f4ece2 100%);
      color: #503d31;
      border: 2px solid rgba(122, 90, 72, 0.12);
      transform: rotateY(180deg);
      font-size: clamp(2rem, 3vw, 3rem);
      box-shadow: 0 8px 16px rgba(101, 70, 52, 0.08);
    }

    .card.matched .card-back {
      background: linear-gradient(135deg, #edf7ef 0%, #dcefe1 100%);
      border-color: rgba(107, 155, 122, 0.6);
      box-shadow: 0 8px 18px rgba(107, 155, 122, 0.15);
    }

    .card.disabled {
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .board {
        gap: 10px;
      }
      .memory-shell {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="localization.js"></script>
  <div class="memory-shell">
    <div class="game-card p-5 sm:p-8">
      <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between mb-8">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.18em] text-clay/80">NeuroSync</p>
          <h1 class="font-display text-4xl sm:text-5xl text-stone-800">Memory Match</h1>
        </div>
        <div class="flex gap-3">
          <a href="dashboard.html" class="rounded-full bg-[#f1e1d0] px-4 py-2 text-sm font-semibold text-stone-700 hover:bg-[#e9d6c0] transition-colors">Back</a>
          <button id="resetBtn" class="rounded-full bg-clay px-4 py-2 text-sm font-semibold text-white hover:bg-[#8a5a3e] transition-colors">Restart</button>
        </div>
      </div>

      <div class="grid gap-4 sm:grid-cols-3 mb-8">
        <div class="rounded-2xl bg-sand p-4 border border-stone-200">
          <p class="text-xs uppercase tracking-[0.18em] text-stone-500">Moves</p>
          <p id="moves" class="font-display text-3xl text-stone-800">0</p>
        </div>
        <div class="rounded-2xl bg-sand p-4 border border-stone-200">
          <p class="text-xs uppercase tracking-[0.18em] text-stone-500">Matches</p>
          <p id="matches" class="font-display text-3xl text-stone-800">0 / 8</p>
        </div>
        <div class="rounded-2xl bg-sand p-4 border border-stone-200">
          <p class="text-xs uppercase tracking-[0.18em] text-stone-500">Time</p>
          <p id="timer" class="font-display text-3xl text-stone-800">00:00</p>
        </div>
      </div>

      <div id="board" class="board" aria-label="Memory match board"></div>
      <p id="saveStatus" class="mt-5 text-center text-sm text-stone-500" aria-live="polite"></p>
    </div>
  </div>

  <script>
    const symbols = ['🌼', '🍋', '🌙', '☕', '🌿', '🐚', '🌷', '🍎'];
    let cards = [];
    let flippedCards = [];
    let moves = 0;
    let matches = 0;
    let timer = 0;
    let timerId = null;
    let lockBoard = false;

    const board = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const matchesEl = document.getElementById('matches');
    const timerEl = document.getElementById('timer');
    const resetBtn = document.getElementById('resetBtn');

    function shuffle(array) {
      const copied = [...array];
      for (let i = copied.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
      }
      return copied;
    }

    function formatTime(seconds) {
      const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function startTimer() {
      if (timerId) return;
      timerId = setInterval(() => {
        timer++;
        timerEl.textContent = formatTime(timer);
      }, 1000);
    }

    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function resetBoard() {
      stopTimer();
      timer = 0;
      moves = 0;
      matches = 0;
      flippedCards = [];
      lockBoard = false;
      timerEl.textContent = '00:00';
      movesEl.textContent = '0';
      matchesEl.textContent = '0 / 8';

      const doubled = shuffle([...symbols, ...symbols]);
      cards = doubled.map((symbol, index) => ({
        id: index,
        symbol,
        matched: false
      }));

      board.innerHTML = cards.map((card) => `
        <button class="card" data-id="${card.id}" aria-label="Hidden memory card">
          <div class="card-inner">
            <div class="card-face card-front"><span class="symbol">?</span></div>
            <div class="card-face card-back">${card.symbol}</div>
          </div>
        </button>
      `).join('');

      board.querySelectorAll('.card').forEach((cardBtn) => {
        cardBtn.addEventListener('click', () => handleCardClick(cardBtn));
      });
    }

    function saveMatchResult() {
      const scores = JSON.parse(localStorage.getItem('neurosyncGameScores') || '[]');
      scores.push({
        moves,
        time: timer,
        score: matches * 10 + (8 - moves),
        recordedAt: new Date().toISOString()
      });
      localStorage.setItem('neurosyncGameScores', JSON.stringify(scores));
      saveSupabaseGameScore({ moves, time: timer, score: matches * 10 + (8 - moves) })
        .then(() => {
          document.getElementById('saveStatus').textContent = 'Score saved to your account.';
        })
        .catch((error) => {
          document.getElementById('saveStatus').textContent = `Score was not saved online: ${error.message}`;
          console.error('Supabase game score save failed:', error);
        });
    }

    function handleCardClick(cardBtn) {
      const cardId = Number(cardBtn.dataset.id);
      const card = cards.find(item => item.id === cardId);

      if (lockBoard || card.matched || flippedCards.includes(cardId)) return;

      startTimer();
      cardBtn.classList.add('flipped');
      flippedCards.push(cardId);

      if (flippedCards.length === 2) {
        moves++;
        movesEl.textContent = moves;
        const [firstId, secondId] = flippedCards;
        const firstCard = cards.find(item => item.id === firstId);
        const secondCard = cards.find(item => item.id === secondId);

        if (firstCard.symbol === secondCard.symbol) {
          firstCard.matched = true;
          secondCard.matched = true;
          const firstBtn = board.querySelector(`[data-id="${firstId}"]`);
          const secondBtn = board.querySelector(`[data-id="${secondId}"]`);
          firstBtn.classList.add('matched', 'disabled');
          secondBtn.classList.add('matched', 'disabled');
          matches++;
          matchesEl.textContent = `${matches} / 8`;
          flippedCards = [];

          if (matches === 8) {
            stopTimer();
            saveMatchResult();
            setTimeout(() => {
              alert(`Amazing! You matched all 8 pairs in ${moves} moves and ${formatTime(timer)}.`);
            }, 300);
          }
        } else {
          lockBoard = true;
          setTimeout(() => {
            const firstBtn = board.querySelector(`[data-id="${firstId}"]`);
            const secondBtn = board.querySelector(`[data-id="${secondId}"]`);
            firstBtn.classList.remove('flipped');
            secondBtn.classList.remove('flipped');
            flippedCards = [];
            lockBoard = false;
          }, 700);
        }
      }
    }

    resetBtn.addEventListener('click', resetBoard);
    resetBoard();
  </script>
</body>
</html>
